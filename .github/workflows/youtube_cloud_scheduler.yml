name: Price X-Ray 600-Short Autonomous Cloud Scheduler

on:
  schedule:
    # Runs every 6 hours in GitHub Cloud (zero laptop needed)
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-cloud-scheduler
  cancel-in-progress: false

jobs:
  upload-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Price X-Ray Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install YouTube Data API v3 Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Restore YouTube OAuth Credentials from Encrypted GitHub Secrets
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
        run: |
          printf '%s' "$YT_TOKEN" > youtube_token.json
          printf '%s' "$YT_SECRETS" > client_secrets.json

      - name: Download Next Batch of Pre-Rendered MP4s from GitHub Release Vault
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 engine/fetch_cloud_release_videos.py

      - name: Upload Next Single Price X-Ray Short (Natural 6h Cadence — Zero Burst Spam)
        run: |
          python3 engine/auto_upload_youtube.py --schedule-4x-daily --max-uploads 1

      - name: Rebuild Storefront & Sync Live YouTube Short Links
        run: |
          python3 engine/build_top_tier_storefront.py

      - name: Clean Temporary Credentials & Video Binaries Before Commit
        if: always()
        run: |
          rm -f youtube_token.json client_secrets.json *.tar
          rm -rf videos/

      - name: Commit & Push Updated Upload Log and Storefront
        run: |
          git config user.name "Price X-Ray Cloud Bot (ANKH ENTERPRISE LTD)"
          git config user.email "ahmed.alsalahy@ankhenterprise.co.uk"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud-scheduler): sync uploaded YouTube Shorts & storefront state"
            git pull --rebase --autostash -X theirs origin main
            git push origin main
          else
            echo "No state changes to commit on this run."
          fi
